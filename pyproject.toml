[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "trialmatch-assignment"
version = "0.1.0"
description = "Individual GenAI assignment: criterion-level trial screening research prototype"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0,<3", "huggingface-hub>=0.27,<2", "pyarrow>=18,<24", "tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
model = ["torch>=2.5,<3", "transformers>=4.46,<5", "peft>=0.14,<1", "accelerate>=1.2,<2", "scikit-learn>=1.6,<2", "matplotlib>=3.9,<4", "streamlit>=1.40,<2"]

[tool.setuptools.packages.find]
where = ["src"]
